appId: com.lorro.launcher
productName: Lorro Launcher
copyright: Copyright © 2026 Lorro Launcher contributors. Based on Hydra Launcher (MIT).
beforePack: scripts/legendary-before-pack.cjs
afterPack: scripts/legendary-after-pack.cjs
afterSign: scripts/legendary-after-pack.cjs
directories:
  buildResources: build
extraResources:
  - ludusavi
  - hydra-native
  - seeds
  - from: node_modules/create-desktop-shortcuts/src/windows.vbs
  - from: resources/achievement.wav
  - from: resources/lorro
  - from: "src/big-picture/src/assets/audio/Favorite Sound.wav"
    to: chat-message.wav
files:
  - "!.cache/**"
  - "!legendary/**"
  - "!resources/legendary/**"
  - "!native/torrent-bridge/**"
  - "!**/.vscode/*"
  - "!src/*"
  - "!native/hydra-native/target"
  - "!native/hydra-native/target/**"
  - "!native/epic-prerequisite-runner/**"
  - "!binaries/epic-prerequisite-runner/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}"
  - "!scripts/register-ts-node.mjs"
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/@img/sharp-libvips-*/**
win:
  executableName: Lorro Launcher
  extraResources:
    - from: legendary/win32/${arch}
      to: legendary
      filter:
        - legendary.exe
        - managed.py
        - managed-legendary.pyz
        - managed-native/**
        - managed-runtime.json
        - python/**
        - hydra-epic-process.exe
        - hydra-epic-process.json
    - from: resources/legendary
      to: legendary
      filter:
        - LICENSE
        - NOTICE.md
    - from: binaries/7z.exe
    - from: binaries/7z.dll
  target:
    - nsis
    - portable
nsis:
  artifactName: lorro-launcher-${version}-windows-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: lorro-launcher-${version}-windows-portable.${ext}
  unpackDirName: false
mac:
  sign: scripts/legendary-mac-sign.cjs
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: legendary/darwin/${arch}
      to: legendary
      filter:
        - legendary
    - from: resources/legendary
      to: legendary
      filter:
        - LICENSE
        - NOTICE.md
    - from: binaries/7zz
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: lorro-launcher-${version}-macos.${ext}
linux:
  executableName: lorro-launcher
  extraResources:
    - from: binaries/epic-prerequisite-runner/x64
      to: epic
      filter:
        - epic-prerequisite-runner.exe
        - .build.json
    - from: legendary/linux/${arch}
      to: legendary
      filter:
        - legendary
        - legendary.pyz
        - managed.py
        - managed-legendary.pyz
        - managed-native/**
        - managed-runtime.json
        - python-runner
        - python/**
        - glibc/**
        - licenses/**
        - .runtime-files.json
    - from: resources/legendary
      to: legendary
      filter:
        - LICENSE
        - NOTICE.md
    - from: binaries/7zzs
    - from: binaries/umu/umu-run
  target:
    - AppImage
    - deb
    - pacman
  maintainer: hectorrh11 <hectorrh11@users.noreply.github.com>
  category: Game
  synopsis: Independent game launcher
  description: >-
    Lorro Launcher is an independent desktop game launcher with a built-in
    download manager, playtime tracking, achievements, save backups and clips.
  mimeTypes:
    - x-scheme-handler/lorro
appImage:
  artifactName: lorro-launcher-${version}-linux-${arch}.${ext}
deb:
  artifactName: lorro-launcher-${version}-linux-${arch}.${ext}
pacman:
  artifactName: lorro-launcher-${version}-linux-${arch}.${ext}
npmRebuild: false
# Auto-update: Lorro Launcher publishes releases to this GitHub repository.
# The main process also needs MAIN_VITE_UPDATE_REPOSITORY=<owner>/<repo> at build
# time (see .env). Update channels can be changed here without touching the code.
publish:
  provider: github
  owner: hectorrh11
  repo: lorro-launcher
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
